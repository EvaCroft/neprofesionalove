<!DOCTYPE html>
<!-- Template: moonGlass-v1 (glass/Apple-styl vizuální design appky Neprofesionálové) -->
<html lang="cs" data-template="moonGlass-v1"><head><meta charset="UTF-8"><title>Neprofesionálové — Přihlášení</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#F5F5F7; --surface:rgba(255,255,255,0.65); --surface-solid:#FFFFFF;
  --text-1:#1D1D1F; --text-2:#6E6E73; --text-3:#A1A1A6; --hairline:rgba(0,0,0,0.08);
  --accent:#635BFF; --accent-b:#FF6FB8; --accent-c:#4FD1FF; --accent-soft:rgba(99,91,255,0.12);
  --shadow:0 24px 70px rgba(0,0,0,0.09); --radius:26px; --font-active:var(--font-sans);
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",Helvetica,Arial,sans-serif;
  --font-serif:"Fraunces",Georgia,serif; --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
[data-mode="dark"] {
  --bg:#000000; --surface:rgba(28,28,30,0.55); --surface-solid:#1C1C1E;
  --text-1:#F5F5F7; --text-2:#98989D; --text-3:#6E6E73; --hairline:rgba(255,255,255,0.09);
  --accent-soft:rgba(139,133,255,0.16); --shadow:0 24px 70px rgba(0,0,0,0.55);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-font-smoothing:antialiased; font-size:16px; }
body { background:var(--bg); color:var(--text-1); font-family:var(--font-active); transition:background .4s,color .4s; min-height:100vh; }
a { color:inherit; }
.orb { position:fixed; top:-220px; left:50%; transform:translateX(-50%); width:1000px; height:1000px; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, var(--accent) 0%, transparent 55%),radial-gradient(circle at 70% 60%, var(--accent-b) 0%, transparent 50%),radial-gradient(circle at 50% 80%, var(--accent-c) 0%, transparent 50%);
  opacity:.28; filter:blur(70px); animation:drift 14s ease-in-out infinite alternate; pointer-events:none; z-index:0; }
[data-mode="dark"] .orb { opacity:.2; }
@keyframes drift { 0%{transform:translateX(-52%) translateY(0) scale(1);} 100%{transform:translateX(-48%) translateY(24px) scale(1.05);} }

.mode-toggle { position:fixed; top:20px; right:20px; z-index:10; width:38px; height:38px; border-radius:50%; background:var(--surface-solid); border:.5px solid var(--hairline); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow); }
.mode-toggle svg { width:17px; height:17px; stroke:var(--text-1); }

.auth-wrap { position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.auth-card { width:100%; max-width:400px; background:var(--surface); backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%); border:.5px solid var(--hairline); border-radius:var(--radius); padding:38px 32px; box-shadow:var(--shadow); }
.auth-brand { text-align:center; margin-bottom:28px; }
.auth-brand .brand { font-size:1.35rem; font-weight:600; letter-spacing:-.3px; }
.auth-brand .tagline { font-size:.8rem; color:var(--text-2); margin-top:5px; }

.auth-tabs { display:flex; gap:3px; background:var(--surface-solid); border:.5px solid var(--hairline); border-radius:100px; padding:6px; margin-bottom:26px; }
.auth-tabs button { flex:1; border:none; background:transparent; padding:10px; border-radius:100px; font-size:.85rem; font-weight:600; color:var(--text-2); cursor:pointer; font-family:inherit; transition:background .2s,color .2s; }
.auth-tabs button.active { background:var(--accent); color:#fff; }

.auth-form.hidden { display:none; }
.field { margin-bottom:16px; }
.field label { display:block; font-size:.78rem; color:var(--text-2); margin-bottom:6px; font-weight:500; }
.field input { width:100%; padding:12px 14px; border-radius:14px; border:.5px solid var(--hairline); background:var(--bg); color:var(--text-1); font-family:inherit; font-size:.9rem; outline:none; transition:border-color .2s; }
.field input:focus { border-color:var(--accent); }
.field-hint { font-size:.72rem; color:var(--text-3); margin-top:5px; }

.form-msg { font-size:.8rem; padding:11px 14px; border-radius:12px; margin-bottom:16px; display:none; line-height:1.4; }
.form-msg.error { background:rgba(255,59,48,.12); color:#FF3B30; display:block; }
.form-msg.success { background:var(--accent-soft); color:var(--accent); display:block; }

.cta-btn { width:100%; background:var(--accent); color:#fff; border:none; border-radius:14px; padding:13px; font-weight:600; font-size:.9rem; font-family:inherit; cursor:pointer; transition:opacity .2s; }
.cta-btn:disabled { opacity:.6; cursor:default; }

.auth-switch { text-align:center; font-size:.8rem; color:var(--text-2); margin-top:20px; }
.auth-switch a { color:var(--accent); font-weight:600; text-decoration:none; cursor:pointer; }
</style>
</head><body data-mode="light">
<script>
/* Pokud je uživatel už přihlášen, nemá tu co dělat - rovnou na Dashboard. */
if (localStorage.getItem('np_token')) { window.location.replace('layout-dashboard.html'); }
</script>
<div class="orb"></div>

<button class="mode-toggle" onclick="toggleMode()" aria-label="Přepnout světlý/tmavý režim">
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 109 9c0-.46-.03-.92-.1-1.36A5.4 5.4 0 0112 3z"/></svg>
</button>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand">Neprofesionálové</div>
      <div class="tagline">Komunita, kde nikdo není expert.</div>
    </div>

    <div class="auth-tabs">
      <button id="tab-login" class="active" onclick="switchTab('login')">Přihlásit se</button>
      <button id="tab-register" onclick="switchTab('register')">Vytvořit účet</button>
    </div>

    <div id="form-msg" class="form-msg"></div>

    <form id="form-login" class="auth-form">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="login-password">Heslo</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="cta-btn">Přihlásit se</button>
    </form>

    <form id="form-register" class="auth-form hidden">
      <div class="field">
        <label for="reg-email">E-mail</label>
        <input type="email" id="reg-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="reg-password">Heslo</label>
        <input type="password" id="reg-password" required autocomplete="new-password">
        <div class="field-hint">Alespoň 8 znaků.</div>
      </div>
      <div class="field">
        <label for="reg-password2">Heslo znovu</label>
        <input type="password" id="reg-password2" required autocomplete="new-password">
      </div>
      <div class="field">
        <label for="reg-referral">Referral kód (nepovinné)</label>
        <input type="text" id="reg-referral" autocomplete="off" placeholder="např. KAROLINA-7F2">
      </div>
      <button type="submit" class="cta-btn">Vytvořit účet</button>
    </form>

    <div class="auth-switch" id="switch-hint">
      Nemáš účet? <a onclick="switchTab('register')">Zaregistruj se</a>
    </div>
  </div>
</div>

<script>
function toggleMode(){ document.body.dataset.mode = document.body.dataset.mode === 'light' ? 'dark' : 'light'; }

function switchTab(which){
  document.getElementById('tab-login').classList.toggle('active', which === 'login');
  document.getElementById('tab-register').classList.toggle('active', which === 'register');
  document.getElementById('form-login').classList.toggle('hidden', which !== 'login');
  document.getElementById('form-register').classList.toggle('hidden', which !== 'register');
  document.getElementById('switch-hint').innerHTML = which === 'login'
    ? 'Nemáš účet? <a onclick="switchTab(\'register\')">Zaregistruj se</a>'
    : 'Už máš účet? <a onclick="switchTab(\'login\')">Přihlas se</a>';
  clearMsg();
}

function showMsg(text, type){
  const el = document.getElementById('form-msg');
  el.textContent = text;
  el.className = 'form-msg ' + type;
}
function clearMsg(){
  const el = document.getElementById('form-msg');
  el.className = 'form-msg';
  el.textContent = '';
}

document.getElementById('form-login').addEventListener('submit', async function(e){
  e.preventDefault();
  clearMsg();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.textContent = 'Přihlašuji…';
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg(data.detail || 'Přihlášení se nezdařilo.', 'error');
      btn.disabled = false; btn.textContent = 'Přihlásit se';
      return;
    }
    localStorage.setItem('np_token', data.access_token);
    showMsg('Přihlášení proběhlo, přesměrovávám…', 'success');
    window.location.href = 'layout-dashboard.html';
  } catch (err) {
    showMsg('Nepodařilo se spojit se serverem. Zkus to znovu.', 'error');
    btn.disabled = false; btn.textContent = 'Přihlásit se';
  }
});

document.getElementById('form-register').addEventListener('submit', async function(e){
  e.preventDefault();
  clearMsg();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const password2 = document.getElementById('reg-password2').value;
  const referral = document.getElementById('reg-referral').value.trim();
  const btn = e.target.querySelector('button[type="submit"]');

  if (password.length < 8) {
    showMsg('Heslo musí mít alespoň 8 znaků.', 'error');
    return;
  }
  if (password !== password2) {
    showMsg('Hesla se neshodují.', 'error');
    return;
  }

  btn.disabled = true; btn.textContent = 'Vytvářím účet…';
  try {
    const payload = { email, password };
    if (referral) payload.referral_code = referral;
    const res = await fetch('/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) {
      showMsg(data.detail || 'Registrace se nezdařila.', 'error');
      btn.disabled = false; btn.textContent = 'Vytvořit účet';
      return;
    }
    // Po úspěšné registraci rovnou přihlásit, ať uživatel nemusí zadávat údaje znovu.
    const loginRes = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const loginData = await loginRes.json();
    if (loginRes.ok) {
      localStorage.setItem('np_token', loginData.access_token);
      showMsg('Účet vytvořen, přihlašuji…', 'success');
      window.location.href = 'layout-dashboard.html';
    } else {
      showMsg('Účet vytvořen. Přihlas se prosím.', 'success');
      switchTab('login');
      btn.disabled = false; btn.textContent = 'Vytvořit účet';
    }
  } catch (err) {
    showMsg('Nepodařilo se spojit se serverem. Zkus to znovu.', 'error');
    btn.disabled = false; btn.textContent = 'Vytvořit účet';
  }
});
</script>
</body></html>
